function coords(arr,w=500,h=150){let min=Math.min(...arr),max=Math.max(...arr);return arr.map((v,i)=>[i*w/(arr.length-1),h-12-(v-min)/(max-min||1)*(h-24)])}function spark(m){return `<svg class="spark" viewBox="0 0 500 150" preserveAspectRatio="none" aria-label="${m.name} 샘플 추이"><polyline points="${coords(m.prices).map(p=>p.join(',')).join(' ')}" fill="none" stroke="${m.change>0?'#55d9ad':'#f18891'}" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>`}function probability(){let m=markets[state.market],p=m.probs[state.horizon];return `<div class="card"><div class="row sectionhead"><h2>AI Market Forecast</h2>${sample}</div><div class="row"><span class="sub">${m.name} · ${[1,5,20][state.horizon]}거래일 전망</span>${badge(m.bias)}</div>${['상승 · Bullish','횡보 · Neutral','하락 · Bearish'].map((x,i)=>`<div class="prob-row"><div class="row"><span class="sub">${x}</span><span class="probvalue ${['positive','neutral','negative'][i]}">${p[i]}<small style="font-size:12px">%</small></span></div><div class="track"><i style="width:${p[i]}%;background:${['var(--green)','var(--amber)','var(--red)'][i]}"></i></div></div>`).join('')}<div class="note">고정 확률 예시 · 실제 AI 또는 예측 모델이 연결되어 있지 않습니다.</div></div>`}
function chart(){let m=markets[state.market],pts=coords(m.prices,800,230);return `<div class="card"><div class="row"><div><h2>${m.name} 가격 추이</h2><div class="sub">최근 20거래일 · 포인트에 마우스를 올리거나 키보드로 탐색</div></div>${sample}</div><div class="row" style="margin-top:18px"><span class="index" style="margin:0">${fmt(m.value)}</span><span class="${m.change>0?'positive':'negative'}">${m.change>0?'▲':'▼'} ${Math.abs(m.change).toFixed(2)}%</span></div><div class="chartwrap"><div class="tooltip" role="status"></div><svg class="pricechart" viewBox="0 0 800 250" preserveAspectRatio="none" aria-label="${m.name} 20거래일 샘플 가격 차트">${[30,90,150,210].map(y=>`<line x1="0" y1="${y}" x2="800" y2="${y}" stroke="#253040" stroke-dasharray="3 5"/>`).join('')}<polygon points="0,245 ${pts.map(p=>p.join(',')).join(' ')} 800,245" fill="#55d9ad" opacity=".06"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${m.change>0?'#55d9ad':'#f18891'}" stroke-width="2.5" vector-effect="non-scaling-stroke"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="10" fill="transparent" tabindex="0" data-point="${i}" aria-label="${i+1}번째 거래일 ${fmt(m.prices[i])}"/>`).join('')}</svg><div class="axis"><span>01.24</span><span>02.03</span><span>02.12</span><span>02.21</span></div></div></div>`}
function overview(){return heading('Daily Market Outlook','시장의 흐름과 다음 움직임을 한눈에')+`<div class="grid markets">${Object.entries(markets).map(([k,m])=>`<button class="card market ${state.market===k?'active':''}" data-market="${k}" aria-pressed="${state.market===k}"><div class="row"><h2>${m.name}</h2><span class="label">${m.ticker}</span></div><div class="index">${fmt(m.value)}</div><div class="tiny ${m.change>0?'positive':'negative'}" style="margin-top:6px">${m.change>0?'▲ +':'▼ '}${m.change.toFixed(2)}% <span class="muted">오늘</span></div>${spark(m)}<div class="row"><span class="tiny muted">5D 상승 <strong class="${tone(m.bias)}">${m.probs[1][0]}%</strong></span>${badge(m.bias)}</div></button>`).join('')}</div><div class="grid two">${probability()}<div class="card"><div class="row sectionhead"><h2>Market Risk Overview</h2><span class="label">GLOBAL</span></div>${[['VIX','16.42','중립'],['미국 10년 국채금리','4.43%','부정'],['달러 인덱스 · DXY','106.61','중립'],['USD / KRW','1,432.50','부정'],['시장 변동성','보통 · Moderate','중립']].map(([a,b,c])=>`<div class="riskrow row"><span class="sub">${a}</span><span class="riskvalue">${b} <span class="${tone(c)} tiny">${c==='부정'?'↑':'—'}</span></span></div>`).join('')}<div class="note">모든 시장 공통 거시 환경 · SAMPLE DATA</div></div></div>`+drivers()+`<div class="card brief"><div class="row"><h2>✧ Daily Market Brief</h2>${sample}</div><p>${markets[state.market].name}의 ${[1,5,20][state.horizon]}거래일 상승 확률을 ${markets[state.market].probs[state.horizon][0]}%로 가정한 화면 예시입니다. ${markets[state.market].momentum>0?'우호적인 모멘텀이 관찰되는 시나리오지만, 금리와 환율 부담이 상승 여력을 제한할 수 있습니다.':'약한 모멘텀과 높은 변동성을 가정하며, 위험 선호 회복 여부를 확인하는 시나리오입니다.'} 이는 실제 AI가 작성한 분석이 아닌 고정 샘플 텍스트입니다.</p></div>`}
function drivers(){let m=markets[state.market];return `<div class="grid drivers"><div class="card"><h3 class="positive">↗ Bullish Factors <span class="muted tiny">/ 상승 요인 · SAMPLE</span></h3>${(m.momentum>0?['긍정적인 가격 모멘텀','시장 참여 종목의 점진적 확대','주도 업종의 실적 개선 기대']:['기술적 반등 가능성','낙폭 확대에 따른 매수 관심','선별적인 이익 개선 기대']).map(t=>`<div class="factor">${t}</div>`).join('')}</div><div class="card bear"><h3 class="negative">↘ Bearish Factors <span class="muted tiny">/ 하락 요인 · SAMPLE</span></h3>${['국채금리 상승에 따른 할인율 부담',m.momentum>0?'지정학적 불확실성':'높은 변동성과 약한 시장 모멘텀','달러 강세와 위험 선호 둔화'].map(t=>`<div class="factor">${t}</div>`).join('')}</div></div>`}
function forecast(){let m=markets[state.market],p=m.probs[state.horizon][0],y=m.yesterday[state.horizon];return heading('Market Forecast','시장별 확률 전망과 분석 근거')+`<div class="grid two">${chart()}${probability()}</div><div class="grid drivers"><div class="card"><div class="row"><h2>Market Regime</h2>${sample}</div><div class="regime">${m.regime}</div><div class="sub">${m.name}의 추세와 변동성을 함께 표현한 가상 시장 국면입니다.</div><div class="note">Forecast Drivers · ${[1,5,20][state.horizon]}D</div>${[['Momentum',m.momentum>0?'긍정':'부정'],['Volatility',state.market==='kq'?'부정':'중립'],['Bond Yield','부정'],['Dollar Strength','중립'],['Market Breadth',m.probs[state.horizon][0]>50?'긍정':'중립']].map(([a,b])=>`<div class="row riskrow"><span class="sub">${a}</span>${badge(b)}</div>`).join('')}</div><div class="card"><h2>Outlook Changes</h2><div class="sub" style="margin-top:8px">상승 확률 변화 · ${m.name} · ${[1,5,20][state.horizon]}D</div><div class="row" style="margin:35px 0"><div><div class="label">YESTERDAY</div><div class="kpi muted">${y}%</div></div><span class="muted">→</span><div><div class="label">TODAY</div><div class="kpi">${p}%</div></div><div><div class="label">CHANGE</div><div class="kpi ${p>=y?'positive':'negative'}">${p>=y?'+':''}${p-y}<small style="font-size:14px">%p</small></div></div></div><div class="note">SAMPLE DATA · 어제와 오늘의 비교 수치는 화면 구성을 위한 고정 예시입니다. 실제 예측 결과나 성능을 의미하지 않습니다.</div></div></div>`}
function indicators(){let m=markets[state.market];let groups=[['Technical Indicators', [['RSI',m.rsi.toFixed(1),m.rsi>50?'긍정':'부정','최근 상승·하락 강도. 일반적으로 70 이상 과열, 30 이하 과매도 참고.'],['MACD',m.momentum>0?'+12.4':'−8.6',m.momentum>0?'긍정':'부정','단기와 장기 이동평균의 차이로 추세 변화를 관찰합니다.'],['SMA 20',fmt(m.value*.991),'긍정','최근 20거래일 평균 가격. 단기 추세의 기준입니다.'],['SMA 50',fmt(m.value*.979),'긍정','최근 50거래일 평균 가격으로 중기 흐름을 확인합니다.'],['SMA 200',fmt(m.value*.947),'긍정','최근 200거래일 평균 가격. 장기 추세의 기준입니다.'],['Momentum',`${m.momentum>0?'+':''}${m.momentum}%`,m.momentum>0?'긍정':'부정','최근 20거래일 가격 변화율을 가정한 추세 강도입니다.']]],['Macroeconomic Indicators',[['US 2Y Treasury Yield','4.28%','중립','미국 2년물 금리. 단기 정책금리 기대를 반영합니다.'],['US 10Y Treasury Yield','4.43%','부정','미국 10년물 금리. 기업 가치 평가의 할인율과 연관됩니다.'],['Yield Spread','+0.15%p','중립','10년물과 2년물 금리 차이. 경기 기대를 관찰합니다.'],['CPI','3.0% YoY','부정','전년 대비 소비자물가 변화율. 인플레이션을 나타냅니다.'],['USD/KRW','1,432.50','부정','달러 대비 원화 환율. 자금 흐름과 수출입에 영향을 줍니다.'],['Dollar Index','106.61','중립','주요 통화 대비 달러 가치의 종합 지수입니다.']]],['Risk Indicators',[['VIX','16.42','중립','S&P 500 옵션에 반영된 향후 30일 기대 변동성입니다.'],['Realized Volatility',state.market==='kq'?'24.8%':'14.6%',state.market==='kq'?'부정':'중립','과거 수익률을 기반으로 연율화한 실제 가격 변동성입니다.'],['Drawdown',state.market==='kq'?'−8.4%':'−2.1%',state.market==='kq'?'부정':'중립','이전 고점 대비 현재 가격의 하락 폭입니다.'],['Credit Spread','3.12%p','중립','회사채와 국채 수익률 차이. 신용 위험 선호를 반영합니다.']]]];return heading('Market Indicators','지표의 수준과 의미를 함께 확인')+`<div class="sub" style="margin-bottom:18px">기술적·실현 변동성 지표: ${m.name} 기준 / 거시경제·VIX·신용 스프레드: 공통 샘플 · 상태 평가는 설명용 예시입니다.</div><div class="grid indicators">${groups.map(([name,items])=>`<div class="card"><div class="row sectionhead"><h2>${name}</h2></div>${items.map(([a,b,c,d])=>`<div class="indicator"><div class="row"><strong>${a}</strong>${badge(c)}</div><div style="font-size:23px;margin-top:9px">${b}</div><p>${d}</p></div>`).join('')}</div>`).join('')}</div>`}
function newsView(){let filtered=news.filter(n=>state.filter==='All'||n[0]===state.filter),counts=['긍정','중립','부정'].map(s=>filtered.filter(n=>n[3]===s).length);return heading('News Intelligence','시장 영향 중심의 뉴스 분석 시나리오',false)+`<div class="card"><div class="row"><h2>News Sentiment</h2><span class="sub">${filtered.length}개 샘플 · ${state.filter==='All'?'전체 카테고리':state.filter}</span></div><div class="distribution">${counts.map((n,i)=>`<span style="width:${n/filtered.length*100}%;background:${['var(--green)','var(--amber)','var(--red)'][i]}"></span>`).join('')}</div><div class="row"><span class="positive tiny">● 긍정 ${counts[0]}</span><span class="neutral tiny">● 중립 ${counts[1]}</span><span class="negative tiny">● 부정 ${counts[2]}</span></div><div class="note">아래 제목과 내용은 모두 가상 시나리오입니다. 실제 기사·출처·AI 분석이 아닙니다.</div></div><div class="filters" aria-label="뉴스 카테고리">${['All',...new Set(news.map(n=>n[0]))].map(c=>`<button class="filter ${state.filter===c?'active':''}" data-filter="${c}" aria-pressed="${state.filter===c}">${c==='All'?'전체 뉴스':c}</button>`).join('')}</div><div class="grid newsgrid">${filtered.map(([cat,title,m,s,imp,time,desc])=>`<article class="card news"><div class="row"><span class="label">${cat}</span>${badge(s)}</div><h3>${title}</h3><div class="tiny muted">${markets[m].name} <span style="margin:0 8px">·</span> ${time} <span style="margin:0 8px">·</span> 중요도 ${imp}/5</div><p>${desc}</p><span class="label">FICTIONAL SCENARIO · SAMPLE DATA</span></article>`).join('')}</div>`}
function performance(){let idx=Object.keys(markets).indexOf(state.market),shift=idx*1.1+state.horizon*.6,acc=(66.8-shift).toFixed(1);return heading('Model Performance','실제 모델 연결 시 확인할 평가 화면의 청사진')+`<div class="sub" style="margin-bottom:18px">DEMO DATA · ${markets[state.market].name} / ${[1,5,20][state.horizon]}D · 가상 평가 기간 2024.01–2025.02 · 학습 또는 백테스트를 수행하지 않았습니다.</div><div class="grid kpis">${[['Prediction Accuracy',acc+'%','전체 방향 예측 중 정답 비율'],['Balanced Accuracy',(64.2-shift).toFixed(1)+'%','클래스별 재현율의 평균'],['Brier Score',(.182+shift*.003).toFixed(3),'확률 예측 오차 · 낮을수록 좋음'],['Log Loss',(.592+shift*.008).toFixed(3),'정답 확률의 로그 손실 · 낮을수록 좋음']].map(([a,b,c])=>`<div class="card"><div class="label">${a}</div><div class="kpi">${b}</div><div class="sub">${c}</div><div class="tiny neutral" style="margin-top:12px">DEMO DATA</div></div>`).join('')}</div><div class="grid two"><div class="card"><div class="row sectionhead"><h2>Model Comparison</h2>${sample}</div><div class="tablewrap"><table><thead><tr><th>모델</th><th>Accuracy</th><th>Balanced</th><th>Brier ↓</th></tr></thead><tbody>${[['Logistic Regression',60.4,58.9,.216],['LightGBM',64.1,62.6,.198],['Ensemble',66.8,64.2,.182]].map(([a,b,c,d])=>`<tr><td>${a}${a==='Ensemble'?' <span class="positive">✧</span>':''}</td><td>${(b-shift).toFixed(1)}%</td><td>${(c-shift).toFixed(1)}%</td><td>${(d+shift*.003).toFixed(3)}</td></tr>`).join('')}</tbody></table></div><div class="note">동일한 시장·기간의 가상 평가 비교. 실거래 성과를 의미하지 않습니다.</div></div><div class="card"><div class="row"><h2>Calibration Chart</h2>${sample}</div><div class="sub" style="margin-top:8px">상승 예측 확률과 실제 상승 빈도의 대응</div><svg viewBox="0 0 360 240" style="width:100%;height:220px" role="img" aria-label="가상 보정 차트. 가로축 예측 확률, 세로축 관측 빈도, 점선은 이상적인 보정"><path d="M40 20V200H330" stroke="#465268" fill="none"/><path d="M40 200L330 20" stroke="#56627a" stroke-dasharray="5 5"/>${[0,25,50,75,100].map((n,i)=>`<text x="30" y="${204-i*45}" fill="#8995a8" text-anchor="end" font-size="10">${n}</text><text x="${40+i*72.5}" y="218" text-anchor="middle" fill="#8995a8" font-size="10">${n}%</text>`).join('')}<polyline points="${[12,27,46,67,85].map((v,i)=>`${69+i*58},${200-(v-shift)*1.8}`).join(' ')}" fill="none" stroke="#8baeff" stroke-width="2.5"/>${[12,27,46,67,85].map((v,i)=>`<circle cx="${69+i*58}" cy="${200-(v-shift)*1.8}" r="4" fill="#8baeff"/>`).join('')}<text x="180" y="238" text-anchor="middle" fill="#8995a8" font-size="10">예측 확률</text></svg><div class="tiny muted">점선: 이상적 보정 · <span style="color:var(--blue)">실선: 가상 관측 빈도 (%)</span></div></div></div><div class="card" style="margin-top:18px"><div class="row sectionhead"><h2>Forecast History</h2><span class="label">DEMO DATA · ${[1,5,20][state.horizon]}D</span></div><div class="tablewrap"><table><thead><tr><th>예측 기준일</th><th>시장</th><th>상승 확률</th><th>예측 방향</th><th>관측 방향 (가상)</th><th>판정</th></tr></thead><tbody>${['2025.01.17','2025.01.16','2025.01.15','2025.01.14'].map((d,i)=>`<tr><td>${d}</td><td>${markets[state.market].name}</td><td>${markets[state.market].probs[state.horizon][0]-i*2}%</td><td>${markets[state.market].bias}</td><td>${i===2?'Neutral':markets[state.market].bias}</td><td class="${i===2?'negative':'positive'}">${i===2?'✕ 불일치':'✓ 일치'}</td></tr>`).join('')}</tbody></table></div><div class="note">모든 예측·관측·판정은 화면 확인을 위한 예시입니다. 상단 집계 수치는 이 4개 행으로 계산한 결과가 아닙니다.</div></div>`}
function render(){if(typeof renderModeChrome==='function')renderModeChrome();document.querySelector('nav').innerHTML=tabs.map((t,i)=>`<button data-tab="${t}" class="${state.tab===t?'active':''}" aria-current="${state.tab===t?'page':'false'}"><span>${icons[i]}</span>${t}</button>`).join('');document.querySelector('#app').innerHTML=state.mode==='real'?realView():({Overview:overview,Forecast:forecast,Indicators:indicators,'News Intelligence':newsView,'Model Performance':performance,'System Status':()=>heading('System Status','DEMO 모드에는 수집·모델 상태가 없습니다',false)+'<div class="card"><div class="sub">실제 수집원·작업 이력은 REAL DATA 모드에서 확인하세요.</div></div>'})[state.tab]();if(state.mode==='real'){bindRealChart();return}document.querySelectorAll('[data-point]').forEach(el=>{let show=()=>{let i=+el.dataset.point,tip=document.querySelector('.tooltip');tip.textContent=`거래일 ${i+1} · ${fmt(markets[state.market].prices[i])} · SAMPLE`;tip.style.display='block';tip.style.left=`${Math.min(65,i/19*70)}%`};let hide=()=>document.querySelector('.tooltip').style.display='none';el.addEventListener('mouseenter',show);el.addEventListener('mouseleave',hide);el.addEventListener('focus',show);el.addEventListener('blur',hide);el.addEventListener('click',show)})}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;render()}if(b.dataset.market){state.market=b.dataset.market;render()}if(b.dataset.horizon!==undefined){state.horizon=+b.dataset.horizon;render()}if(b.dataset.filter){state.filter=b.dataset.filter;render()}});document.addEventListener('change',e=>{if(e.target.id==='market-select'){state.market=e.target.value;render()}});render();
</script><script src="real-data.js"></script><script src="intel.js"></script></body></html>
